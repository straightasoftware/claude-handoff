name: test
on:
  push:
  pull_request:
# The tests only read the checkout; without this the token gets the
# repository default, which can include write access.
permissions:
  contents: read
jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The shell wrapper must work in zsh as well as bash; Ubuntu runners lack zsh.
      - run: sudo apt-get update -q && sudo apt-get install -y -q zsh
      - run: tests/run.sh
